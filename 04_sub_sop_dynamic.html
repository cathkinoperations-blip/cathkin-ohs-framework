<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SOP Document | Cathkin Estates HOA</title>
    <base target="_self">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.6; color: #2d3748; max-width: 900px; margin: 30px auto; padding: 25px; background-color: #ffffff; border: 1px solid #cbd5e0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        h1 { font-size: 15pt; color: #1a365d; border-bottom: 2px solid #1a365d; padding-bottom: 6px; margin-bottom: 15px; }
        h2 { font-size: 11pt; color: #c53030; margin-top: 22px; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        p, li { font-size: 9pt; }
        ul { margin-top: 4px; margin-bottom: 12px; }
        li { margin-bottom: 4px; }
        .alert-box { background-color: #fff5f5; border-left: 4px solid #e53e3e; padding: 12px 16px; margin-bottom: 20px; font-size: 8.5pt; color: #9b2c2c; border-radius: 4px; }
        .nav-link { display: inline-block; margin-bottom: 15px; color: #3182ce; text-decoration: none; font-weight: bold; font-size: 9pt; }
        .nav-link:hover { text-decoration: underline; }
        .btn-print { background-color: #3182ce; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; float: right; font-size: 9pt; }
        .btn-print:hover { background-color: #2b6cb0; }
        
        /* Image / Map Grid Styling */
        .sop-image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 16px 0; }
        .sop-image-card { border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; background: #f8fafc; text-align: center; }
        .sop-image-card img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #e2e8f0; }
        .sop-image-caption { font-size: 8pt; color: #64748b; margin: 8px 0 2px 0; font-weight: 600; }

        @media print { 
            .btn-print, .nav-link { display: none; } 
            body { border: none; margin: 0; padding: 10px; box-shadow: none; max-width: 100%; } 
        }
    </style>
</head>
<body>
    <div>
        <button class="btn-print" onclick="window.print()">🖨️ Print SOP Document</button>
        <a href="04_sop_safe_work.html" class="nav-link">&larr; Back to Module 04 Hub</a>
    </div>
    
    <h1 id="sop-main-title">Loading SOP Document...</h1>

    <div id="sop-alert-container"></div>
    <div id="sop-sections-container">
        <p style="color: #64748b; font-style: italic;">Fetching procedure details from database...</p>
    </div>

    <script>
        const API_BASE = 'https://cathkin-ohs-framework.vercel.app/api';
        const urlParams = new URLSearchParams(window.location.search);
        const sopSlug = urlParams.get('sop') || 'firebreaks';

        async function loadSopContent() {
            try {
                // FIXED: Use sopSlug instead of slug
                const response = await fetch(`${API_BASE}/import-sop?slug=${encodeURIComponent(sopSlug)}`);
                const data = await response.json();

                if (!data.success || !data.sop) {
                    document.getElementById('sop-main-title').textContent = 'SOP Document Not Found';
                    document.getElementById('sop-sections-container').innerHTML = `
                        <div class="alert-box" style="background: #fffbeb; border-color: #f59e0b; color: #b45309;">
                            <strong>Notice:</strong> No record could be found for slug <code>${sopSlug}</code>. Please check your database or upload the manual using the admin portal.
                        </div>
                    `;
                    return;
                }

                const sop = data.sop;
                document.getElementById('page-title').textContent = `${sop.reference}: ${sop.title} | Cathkin Estates HOA`;
                document.getElementById('sop-main-title').textContent = `${sop.reference}: ${sop.title.toUpperCase()}`;

                // Render Alert Box if stored in database
                if (sop.alert_json) {
                    const alert = typeof sop.alert_json === 'string' ? JSON.parse(sop.alert_json) : sop.alert_json;
                    document.getElementById('sop-alert-container').innerHTML = `
                        <div class="alert-box">
                            <strong>${alert.title}:</strong> ${alert.text}
                        </div>
                    `;
                }

                // Render Sections, Bullet Items, and Images/Maps
                const container = document.getElementById('sop-sections-container');
                container.innerHTML = '';

                const sections = typeof sop.sections_json === 'string' ? JSON.parse(sop.sections_json) : sop.sections_json;

                if (!sections || sections.length === 0) {
                    container.innerHTML = '<p>No content sections defined for this procedure.</p>';
                    return;
                }
                
                sections.forEach(sec => {
                    let sectionHtml = `<h2>${sec.heading}</h2>`;

                    if (sec.items && sec.items.length > 0) {
                        sectionHtml += '<ul>';
                        sec.items.forEach(item => {
                            sectionHtml += `<li>${item}</li>`;
                        });
                        sectionHtml += '</ul>';
                    }

                    if (sec.images && sec.images.length > 0) {
                        sectionHtml += '<div class="sop-image-grid">';
                        sec.images.forEach(img => {
                            sectionHtml += `
                                <div class="sop-image-card">
                                    <img src="${img.url}" alt="${img.caption || 'SOP Diagram'}" loading="lazy">
                                    <p class="sop-image-caption">${img.caption || ''}</p>
                                </div>
                            `;
                        });
                        sectionHtml += '</div>';
                    }

                    container.innerHTML += sectionHtml;
                });

            } catch (err) {
                console.error('Failed to load SOP:', err);
                document.getElementById('sop-main-title').textContent = 'Error Loading SOP Document';
                document.getElementById('sop-sections-container').innerHTML = `
                    <div class="alert-box">
                        <strong>Connection Error:</strong> Unable to connect to the backend database API. Please try again later.
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSopContent);
    </script>
</body>
</html>
