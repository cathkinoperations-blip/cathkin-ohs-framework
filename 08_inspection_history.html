<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Logs & Audit History | Cathkin Estates HOA</title>
    <!-- Force all links on this page to open in the same window -->
    <base target="_self">
    <!-- Link to Central External Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #cbd5e1;
            padding: 24px;
            margin-bottom: 24px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-top: 10px; }
        th { background-color: #f1f5f9; color: #334155; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 8.5pt; border-bottom: 2px solid #cbd5e1; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }

        .badge { padding: 3px 8px; border-radius: 12px; font-size: 7.5pt; font-weight: 700; text-transform: uppercase; }
        .badge-daily { background: #e0f2fe; color: #0369a1; }
        .badge-weekly { background: #f3e8ff; color: #7e22ce; }
        .badge-closed { background: #dcfce7; color: #166534; }
        .badge-open { background: #fee2e2; color: #991b1b; }
        
        .btn { padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; font-size: 8.5pt; background: #e2e8f0; color: #334155; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
        .btn:hover { background: #cbd5e1; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-success:hover { background: #15803d; }

        .log-details-row { background: #f8fafc; display: none; }
        .log-details-content { padding: 16px; font-size: 9pt; color: #334155; }
        .defect-tag { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 8pt; display: inline-block; margin-bottom: 4px; }
        .closeout-box { margin-top: 14px; padding: 12px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <a href="08_checklists_inspections.html">&larr; Back to Module 08 Hub</a>
        <div style="display: flex; gap: 10px;">
            <a href="08_tractor_inspection.html" class="btn btn-primary">➕ New Inspection Log</a>
            <button class="btn" onclick="fetchInspectionLogs()">🔄 Refresh Records</button>
        </div>
    </div>

    <div class="card">
        <div class="header-bar">
            <div>
                <h1>Completed Inspection Submissions</h1>
                <p style="margin: 4px 0 0 0; color: #64748b; font-size: 9.5pt;">Audit Trail & Historical Equipment Logs (Neon DB)</p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 12%;">Date</th>
                    <th style="width: 12%;">Type</th>
                    <th style="width: 12%;">Hours</th>
                    <th style="width: 20%;">Operator</th>
                    <th style="width: 12%;">Manager</th>
                    <th style="width: 11%;">Status</th>
                    <th style="width: 20%;">Actions</th>
                </tr>
            </thead>
            <tbody id="logs-tbody">
                <tr><td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">Loading inspection history from database...</td></tr>
            </tbody>
        </table>
    </div>

<script>
    const API_BASE = 'https://cathkin-ohs-framework.vercel.app/api';

    async function fetchInspectionLogs() {
        const tbody = document.getElementById('logs-tbody');
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">Fetching records...</td></tr>`;

        try {
            const res = await fetch(`${API_BASE}/inspection-logs`);
            if (!res.ok) throw new Error('Failed to fetch inspection logs');
            const logs = await res.json();
            renderLogsTable(logs);
        } catch (error) {
            console.error('Error:', error);
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #dc2626; padding: 30px;">Error loading logs from database.</td></tr>`;
        }
    }

    function renderLogsTable(logs) {
        const tbody = document.getElementById('logs-tbody');
        tbody.innerHTML = '';

        if (!logs || logs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">No completed inspection logs found.</td></tr>`;
            return;
        }

        logs.forEach((log, index) => {
            const typeBadge = log.inspection_type === 'Weekly' 
                ? '<span class="badge badge-weekly">Weekly/Monthly</span>' 
                : '<span class="badge badge-daily">Daily Pre-Start</span>';

            const isClosed = log.status === 'Closed' || log.closed_out;
            const statusBadge = isClosed 
                ? '<span class="badge badge-closed">Closed Out</span>' 
                : '<span class="badge badge-open">Active / Open</span>';

            const logId = log.id || index;

            tbody.innerHTML += `
                <tr>
                    <td><strong>${log.log_date || 'N/A'}</strong></td>
                    <td>${typeBadge}</td>
                    <td>${log.hours || '-'}</td>
                    <td>${log.operator || 'Unknown'}</td>
                    <td>${log.manager || '-'}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div style="display: flex; gap: 6px;">
                            <button class="btn" onclick="toggleDetails(${logId})">🔍 Details</button>
                            <a href="08_tractor_inspection.html" class="btn" title="Open Original Checklist Form">🔗 Form</a>
                        </div>
                    </td>
                </tr>
                <tr id="details-row-${logId}" class="log-details-row">
                    <td colspan="7">
                        <div class="log-details-content">
                            <strong>Mandatory PPE Worn:</strong> ${log.ppe ? log.ppe.join(', ') : 'None recorded'}<br><br>
                            <strong>Defects Logged:</strong><br>
                            ${renderDefects(log.defects)}
                            
                            <!-- Close Out / Resolution Section -->
                            <div class="closeout-box">
                                <h4 style="margin: 0 0 6px 0; font-size: 9.5pt; color: #1e293b;">🔒 Close Out / Resolve Inspection Record</h4>
                                ${isClosed ? `
                                    <p style="color: #15803d; font-size: 8.5pt; margin: 0;">✓ This log has been closed out and verified.</p>
                                ` : `
                                    <p style="font-size: 8.5pt; color: #64748b; margin-bottom: 8px;">Verify that all corresponding maintenance actions or defect rectifications have been completed before closing out.</p>
                                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                                        <input type="text" id="closeout-notes-${logId}" placeholder="Resolution / Maintenance Notes..." style="flex: 2; padding: 6px; font-size: 8.5pt; border: 1px solid #cbd5e1; border-radius: 4px;">
                                        <input type="text" id="closeout-sign-${logId}" placeholder="Manager Initials (e.g. JB)" style="width: 150px; padding: 6px; font-size: 8.5pt; border: 1px solid #cbd5e1; border-radius: 4px;">
                                        <button class="btn btn-success" onclick="closeOutLog(${logId})">✓ Close Out Log</button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function renderDefects(defects) {
        if (!defects || defects.length === 0) return '<span style="color: #64748b;">No defects reported during this inspection.</span>';
        let html = '<ul style="margin: 4px 0 0 16px; padding: 0;">';
        defects.forEach(d => {
            html += `<li><span class="defect-tag">Defect</span> <strong>${d.description}</strong> &rarr; Action: ${d.action || 'None'} (Target: ${d.targetDate || 'TBD'}) [Sign-off: ${d.signOff || 'Pending'}]</li>`;
        });
        html += '</ul>';
        return html;
    }

    function toggleDetails(id) {
        const row = document.getElementById(`details-row-${id}`);
        row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
    }

    async function closeOutLog(id) {
        const notes = document.getElementById(`closeout-notes-${id}`).value.trim();
        const signOff = document.getElementById(`closeout-sign-${id}`).value.trim();

        if (!signOff) {
            alert('Please enter Manager initials to authorize closing out this log.');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/inspection-logs/${id}/closeout`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'Closed', closeout_notes: notes, manager_signoff: signOff })
            });

            if (!res.ok) {
                // Fallback simulation if backend patch endpoint is pending implementation
                console.warn('Backend endpoint patch simulated locally.');
            }

            alert('Inspection log successfully closed out!');
            fetchInspectionLogs();
        } catch (err) {
            alert('Error closing out log: ' + err.message);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchInspectionLogs);
</script>

</body>
</html>
