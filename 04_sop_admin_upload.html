<div class="card" style="background: #f8fafc; border: 1px dashed #2563eb; padding: 24px; border-radius: 8px; margin-top: 20px;">
    <h3 style="margin-top: 0; color: #1e3a8a; font-size: 12pt;">📄 AI Word Document to SOP Generator</h3>
    <p style="font-size: 9pt; color: #64748b;">Upload a Word (.docx) or PDF manual (e.g., Fire Manual) to auto-extract sections and publish to the database.</p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px;">
        <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">URL Slug (e.g., fire-manual)</label>
            <input type="text" id="sop-slug-input" class="item-note" placeholder="fire-manual">
        </div>
        <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">HSSE Category</label>
            <select id="sop-category-input" class="item-note">
                <option value="Safe Work Procedures">Safe Work Procedures</option>
                <option value="Emergency Preparedness">Emergency Preparedness[cite: 4]</option>
                <option value="Environmental Compliance">Environmental Compliance</option>
            </select>
        </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <input type="file" id="sop-file-input" accept=".docx,.pdf" style="flex: 1; background: #fff; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
        <button type="button" class="btn btn-primary" onclick="uploadAndGenerateSop()">🚀 Generate SOP from Document</button>
    </div>
    <div id="upload-status" style="margin-top: 10px; font-size: 9pt; font-weight: bold; color: #2563eb;"></div>
</div>

<script>
    // Helper function to convert uploaded file to Base64 string
function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// Main upload and generation function
async function uploadAndGenerateSop() {
    const fileInput = document.getElementById('sop-file-input');
    const slug = document.getElementById('sop-slug-input').value.trim();
    const category = document.getElementById('sop-category-input').value;
    const statusDiv = document.getElementById('upload-status');

    if (!fileInput.files.length || !slug) {
        alert('Please provide both a document file and a unique URL slug.');
        return;
    }

    statusDiv.style.color = '#2563eb';
    statusDiv.textContent = '⌛ Reading document, saving to Reference folder, and generating database entry with AI...';

    try {
        const file = fileInput.files[0];
        const base64 = await toBase64(file);

        const response = await fetch('https://cathkin-ohs-framework.vercel.app/api/import-sop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fileBase64: base64,
                fileName: file.name, // Passes original filename to store in Reference folder
                mimeType: file.type,
                slug: slug,
                category: category
            })
        });

        const data = await response.json();
        if (data.success) {
            statusDiv.style.color = '#16a34a';
            statusDiv.textContent = `✅ Successfully created SOP: "${data.title}" and saved to Reference folder! Redirecting...`;
            setTimeout(() => {
                window.location.href = `04_sub_sop_dynamic.html?sop=${slug}`;
            }, 1500);
        } else {
            throw new Error(data.error);
        }
    } catch (err) {
        statusDiv.style.color = '#dc2626';
        statusDiv.textContent = '⚠️ Import failed: ' + err.message;
    }
}
</script>
