<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Record Detail — Cathkin Estates OHS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.5;
        }
        header {
            background: #0f172a;
            color: #ffffff;
            padding: 18px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        header h1 {
            margin: 0;
            font-size: 1.2rem;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            background: #334155;
        }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px 40px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .top-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-open {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-closed {
            background: #dcfce7;
            color: #166534;
        }
        .badge-approved {
            background: #dcfce7;
            color: #166534;
        }
        .badge-flagged {
            background: #fee2e2;
            color: #991b1b;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .meta-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
        }
        .meta-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin-bottom: 4px;
        }
        .meta-value {
            font-weight: bold;
            color: #0f172a;
            word-break: break-word;
        }
        .section-block {
            margin-top: 18px;
        }
        .section-block h3 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: #1e3a8a;
        }
        .text-box {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }
        .evidence-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            background: #ffffff;
        }
        .evidence-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            margin-bottom: 8px;
        }
        .evidence-link {
            font-size: 0.82rem;
            word-break: break-all;
        }
        .evidence-link a {
            color: #2563eb;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: #1e293b;
        }
        .form-group input,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.92rem;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }
        .auth-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .auth-box h4 {
            margin: 0 0 10px;
            font-size: 0.95rem;
            color: #0f172a;
        }
        .btn {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-blue {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-green {
            background: #15803d;
            color: #ffffff;
        }
        .eval-banner {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
        }
        .required-star {
            color: #dc2626;
        }
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
        }
        .muted {
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Cathkin Estates HOA — OHS Incident Detail</h1>
        <nav class="nav-links">
            <a href="03_sub_gar_annexure_1_register.html">Active Register</a>
            <a href="03_gar_annexure_1_history.html">Closed History</a>
        </nav>
    </header>

    <main id="app">
        <div class="card">
            <p class="muted">Loading incident record...</p>
        </div>
    </main>

    <script>
        let activeIncident = null;
        let currentCloseAiAssessment = null;

        function splitEvidenceItems(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') return [];
            const parts = rawUrl.split(',').map(s => s.trim()).filter(Boolean);
            const items = [];
            for (let i = 0; i < parts.length; i++) {
                if (
                    parts[i].startsWith('data:') &&
                    parts[i + 1] &&
                    !parts[i + 1].startsWith('data:') &&
                    !parts[i + 1].startsWith('http')
                ) {
                    items.push(`${parts[i]},${parts[i + 1]}`);
                    i++;
                } else {
                    items.push(parts[i]);
                }
            }
            return items;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(val) {
            if (!val) return '—';
            const d = new Date(val);
            return Number.isNaN(d.getTime()) ? String(val) : d.toLocaleString();
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function renderEvidenceSection(title, rawUrl) {
            const items = splitEvidenceItems(rawUrl);
            if (items.length === 0) {
                return `
                    <div class="section-block">
                        <h3>${escapeHtml(title)}</h3>
                        <p class="muted">No evidence files recorded.</p>
                    </div>
                `;
            }

            const cardsHtml = items.map((item, idx) => {
                const isImageData = item.startsWith('data:image/');
                const isPdfData = item.startsWith('data:application/pdf');
                const isHttp = item.startsWith('http://') || item.startsWith('https://');
                const isPdfUrl = isHttp && item.toLowerCase().includes('.pdf');

                let mediaHtml = '';
                if (isImageData || (isHttp && !isPdfUrl)) {
                    mediaHtml = `<img src="${escapeHtml(item)}" alt="${escapeHtml(title)} #${idx + 1}" />`;
                } else if (isPdfData) {
                    mediaHtml = `<p class="muted">PDF document attached (${Math.round(item.length * 0.75 / 1024)} KB approx.)</p>`;
                }

                let linkHtml = '';
                if (isHttp) {
                    linkHtml = `<div class="evidence-link"><a href="${escapeHtml(item)}" target="_blank" rel="noopener noreferrer">Open URL</a></div>`;
                } else if (isPdfData) {
                    linkHtml = `<div class="evidence-link"><a href="${escapeHtml(item)}" download="evidence_${idx + 1}.pdf">Download PDF</a></div>`;
                } else {
                    linkHtml = `<div class="evidence-link muted">Stored upload</div>`;
                }

                return `
                    <div class="evidence-card">
                        <div style="font-weight: bold; font-size: 0.85rem; margin-bottom: 6px;">Item ${idx + 1}</div>
                        ${mediaHtml}
                        ${linkHtml}
                    </div>
                `;
            }).join('');

            return `
                <div class="section-block">
                    <h3>${escapeHtml(title)} (${items.length})</h3>
                    <div class="evidence-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderAiSection(rawAi) {
            if (!rawAi) return '';
            let badgeHtml = '';
            let notesText = '';

            try {
                const parsed = typeof rawAi === 'string' ? JSON.parse(rawAi) : rawAi;
                notesText = parsed.assessment_notes || JSON.stringify(parsed, null, 2);
                if (typeof parsed.satisfactory === 'boolean') {
                    badgeHtml = parsed.satisfactory
                        ? '<span class="badge badge-approved" style="margin-bottom: 8px;">Verification Approved</span>'
                        : '<span class="badge badge-flagged" style="margin-bottom: 8px;">Deficiencies Flagged</span>';
                }
            } catch (_) {
                notesText = String(rawAi);
            }

            return `
                <div class="section-block">
                    <h3>AI Close-Out Verification Findings</h3>
                    <div class="text-box">
                        ${badgeHtml ? `<div>${badgeHtml}</div>` : ''}
                        <div>${escapeHtml(notesText)}</div>
                    </div>
                </div>
            `;
        }

        function renderCloseOutSection(inc) {
            if (String(inc.status || '').toLowerCase() === 'closed') {
                return '';
            }

            return `
                <div class="card" id="close-out-card">
                    <h3 style="margin-top: 0; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                        Close-Out Verification &amp; Closure
                    </h3>
                    <form id="detail-close-form">
                        <div class="form-group">
                            <label for="close-image">Close-Out Evidence (Photos &amp; PDFs, up to 5) <span class="required-star">*</span></label>
                            <input type="file" id="close-image" accept="image/*,application/pdf" multiple required />
                            <div class="muted" style="margin-top: 4px;">Upload remediation evidence, then run AI close-out verification before closing.</div>
                        </div>

                        <div class="form-group">
                            <div>
                                <button type="button" id="btn-eval-close" class="btn btn-blue">Run Close-Out Verification</button>
                            </div>
                            <div id="close-eval-status" class="eval-banner"></div>
                        </div>

                        <div class="form-group">
                            <label for="close-notes">Manager Remediation Notes <span class="required-star">*</span></label>
                            <textarea id="close-notes" placeholder="Confirm how the issue was resolved..." required></textarea>
                        </div>

                        <div class="auth-box">
                            <h4>Manager Authentication Required</h4>
                            <div class="form-grid">
                                <div class="form-group" style="margin-bottom: 0;">
                                    <label for="mgr-username">Username <span class="required-star">*</span></label>
                                    <input type="text" id="mgr-username" placeholder="Manager username" required />
                                </div>
                                <div class="form-group" style="margin-bottom: 0;">
                                    <label for="mgr-password">Password / PIN <span class="required-star">*</span></label>
                                    <input type="password" id="mgr-password" placeholder="Password or PIN" required />
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end;">
                            <button type="submit" id="btn-confirm-close" class="btn btn-green">Confirm &amp; Close Incident</button>
                        </div>
                    </form>
                </div>
            `;
        }

        async function handleEvaluateCloseOut() {
            const fileInput = document.getElementById('close-image');
            const statusDiv = document.getElementById('close-eval-status');
            const btn = document.getElementById('btn-eval-close');

            if (!activeIncident) {
                alert('Incident context not loaded.');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please upload close-out evidence files first.');
                return;
            }
            if (fileInput.files.length > 5) {
                alert('A maximum of 5 files is allowed.');
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.style.background = '#eff6ff';
            statusDiv.style.color = '#1d4ed8';
            statusDiv.textContent = 'Verifying close-out evidence...';
            btn.disabled = true;

            try {
                const imagesPayload = [];
                for (const file of fileInput.files) {
                    const b64 = await toBase64(file);
                    imagesPayload.push({
                        imageBase64: b64,
                        mimeType: file.type || 'image/jpeg'
                    });
                }

                const res = await fetch('/api/incidents?action=analyze-close', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'analyze-close',
                        images: imagesPayload,
                        description: activeIncident.description,
                        corrective_action: activeIncident.corrective_action
                    })
                });
                const data = await res.json();

                if (!res.ok || !data.success || !data.evaluation) {
                    throw new Error(data.error || 'Close-out verification failed.');
                }

                currentCloseAiAssessment = JSON.stringify(data.evaluation);
                const evalData = data.evaluation;
                statusDiv.style.background = evalData.satisfactory ? '#dcfce7' : '#fee2e2';
                statusDiv.style.color = evalData.satisfactory ? '#166534' : '#991b1b';
                statusDiv.innerHTML = `<strong>${evalData.satisfactory ? 'Remediation Approved' : 'Deficiencies Noted'}:</strong> ${escapeHtml(evalData.assessment_notes || '')}`;

                const notesField = document.getElementById('close-notes');
                if (notesField && !notesField.value.trim() && evalData.assessment_notes) {
                    notesField.value = evalData.assessment_notes;
                }
            } catch (err) {
                statusDiv.style.background = '#fee2e2';
                statusDiv.style.color = '#991b1b';
                statusDiv.textContent = `Verification failed: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function handleCloseSubmit(e) {
            e.preventDefault();

            if (!currentCloseAiAssessment) {
                alert('Verification required! Please click "Run Close-Out Verification" before confirming close-out.');
                return;
            }

            const notes = document.getElementById('close-notes').value.trim();
            const fileInput = document.getElementById('close-image');
            const username = document.getElementById('mgr-username').value.trim();
            const password = document.getElementById('mgr-password').value;
            const submitBtn = document.getElementById('btn-confirm-close');

            if (!notes) {
                alert('Please enter manager remediation notes.');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please attach close-out evidence files before submitting.');
                return;
            }

            submitBtn.disabled = true;
            try {
                const filesBase64 = [];
                for (const file of fileInput.files) {
                    const b64 = await toBase64(file);
                    filesBase64.push(b64);
                }

                const authRes = await fetch('/api/verify-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        requiredRole: 'Manager'
                    })
                });
                const authData = await authRes.json();

                if (!authData.authorized) {
                    alert('Authorization failed: ' + (authData.message || 'Invalid manager credentials.'));
                    return;
                }

                const closeRes = await fetch('/api/incidents?action=close', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'close',
                        id: activeIncident.id,
                        close_image_url: filesBase64.join(','),
                        ai_close_assessment: currentCloseAiAssessment,
                        verified_by: authData.fullName || username
                    })
                });
                const closeResult = await closeRes.json();

                if (!closeRes.ok || !closeResult.success) {
                    alert('Error closing incident: ' + (closeResult.error || 'Server error'));
                    return;
                }

                alert('Incident successfully verified and closed by ' + (authData.fullName || username) + '!');
                currentCloseAiAssessment = null;
                await loadIncident(activeIncident.id);
            } catch (err) {
                console.error('Close-out error:', err);
                alert('Failed to process close-out verification.');
            } finally {
                if (document.getElementById('btn-confirm-close')) {
                    document.getElementById('btn-confirm-close').disabled = false;
                }
            }
        }

        function bindCloseOutEvents() {
            const evalBtn = document.getElementById('btn-eval-close');
            const closeForm = document.getElementById('detail-close-form');
            const fileInput = document.getElementById('close-image');

            if (evalBtn) {
                evalBtn.addEventListener('click', handleEvaluateCloseOut);
            }
            if (closeForm) {
                closeForm.addEventListener('submit', handleCloseSubmit);
            }
            if (fileInput) {
                fileInput.addEventListener('change', () => {
                    currentCloseAiAssessment = null;
                    const statusDiv = document.getElementById('close-eval-status');
                    if (statusDiv) {
                        statusDiv.style.display = 'none';
                    }
                });
            }
        }

        function renderIncident(inc) {
            activeIncident = inc;
            const statusLower = String(inc.status || '').toLowerCase();
            const statusClass = statusLower === 'closed' ? 'badge-closed' : 'badge-open';

            document.title = `Incident #${inc.id} — Cathkin Estates OHS`;
            document.getElementById('app').innerHTML = `
                <div class="card">
                    <div class="top-row">
                        <div>
                            <h2 style="margin: 0;">Incident #${escapeHtml(inc.id)} — ${escapeHtml(inc.incident_type || 'Incident')}</h2>
                            <div class="muted">Location: ${escapeHtml(inc.location || '—')}</div>
                        </div>
                        <span class="badge ${statusClass}">${escapeHtml(inc.status || 'Open')}</span>
                    </div>

                    <div class="meta-grid">
                        <div class="meta-item">
                            <div class="meta-label">Severity</div>
                            <div class="meta-value">${escapeHtml(inc.severity || '—')}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Incident Date</div>
                            <div class="meta-value">${escapeHtml(formatDate(inc.incident_date))}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Expected Close-Out Date</div>
                            <div class="meta-value">${escapeHtml(formatDate(inc.expected_close_date))}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Verified / Closed At</div>
                            <div class="meta-value">${escapeHtml(formatDate(inc.verified_at))}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Reported By</div>
                            <div class="meta-value">${escapeHtml(inc.reported_by || '—')}${inc.reporter_email ? ` (${escapeHtml(inc.reporter_email)})` : ''}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Responsible Person</div>
                            <div class="meta-value">${escapeHtml(inc.responsible_person || 'Unassigned')}</div>
                        </div>
                    </div>

                    <div class="section-block">
                        <h3>Description</h3>
                        <div class="text-box">${escapeHtml(inc.description || 'No description provided.')}</div>
                    </div>

                    <div class="section-block">
                        <h3>CAPA / Corrective Action</h3>
                        <div class="text-box">${escapeHtml(inc.corrective_action || 'Pending initial review')}</div>
                    </div>

                    ${renderAiSection(inc.ai_close_assessment)}
                    ${renderEvidenceSection('Initial Incident Evidence', inc.incident_image_url)}
                    ${renderEvidenceSection('Close-Out / Remediation Evidence', inc.close_image_url)}
                </div>

                ${renderCloseOutSection(inc)}
            `;

            bindCloseOutEvents();
        }

        function renderError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error-box">
                    <strong>Unable to load incident:</strong> ${escapeHtml(message)}
                </div>
            `;
        }

        async function loadIncident(id) {
            try {
                const res = await fetch(`/api/incidents?action=get&id=${encodeURIComponent(id)}`);
                const data = await res.json();
                if (!res.ok || !data.success || !data.incident) {
                    renderError(data.error || 'Incident record not found.');
                    return;
                }
                renderIncident(data.incident);
            } catch (err) {
                renderError(err.message || 'Network error while loading incident.');
            }
        }

        (async function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id || !/^\d+$/.test(id)) {
                renderError('Missing or invalid incident ID in URL (expected ?id=...).');
                return;
            }
            await loadIncident(id);
        })();
    </script>
</body>
</html>
